{{- $section1 := .Site.Params.section1 }}
{{- $title    := index $section1 "title" }}
{{- $subtitle := index $section1 "subtitle" }}
{{- $tiles    := index $section1 "tiles" }}
<section class="section section-feature-grey is-medium" id="section1">
  <div class="container">
    <div class="title-wrapper has-text-centered">
      <h2 class="title is-2">{{ $title }}</h2>
      <h3 class="subtitle is-5 is-muted">{{ $subtitle }}</h3>
      <div class="divider is-centered"></div>
    </div>

    <div class="content-wrapper">
      <div class="columns">
        {{- range $tiles }}
        <div class="column is-one-third">
          <div class="feature-card is-bordered has-text-centered revealOnScroll delay-1" data-animation="fadeInLeft">
            <div class="card-image-wrapper">
              <img src="{{ printf "images/illustrations/icons/%s.png" .icon | relURL }}" class="card-image">
            </div>
            <div class="card-content">
              <div class="card-title">
                <h4>{{ .title }}</h4>
              </div>
              <div class="card-text">
                <p>{{ .text }}</p>
              </div>
              <div class="card-action">
                <a href="{{ .url }}" class="button btn-align-md accent-btn raised count-up">{{ .buttonText }}</a>
              </div>
            </div>
          </div>
        </div>
        {{- end }}
      </div>
    </div>
  </div>
</section>

<style>
.feature-card {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  padding: 0 !important;
  border: 1px solid #e5e5e5;
}

.card-image-wrapper {
  position: relative;
  padding-top: 100%; /* 1:1 비율로 변경 */
  width: 100%;
  overflow: hidden;
  margin: 0;
  background-color: #f5f5f5;
}

.card-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  margin: 0;
  padding: 0;
}

.card-content {
  padding: 1.5rem;
  background: white;
  margin-top: auto;
}

.card-title {
  margin-bottom: 1rem;
}

.card-text {
  margin-bottom: 1rem;
}

.card-action {
  margin-top: 1rem;
}
</style>
