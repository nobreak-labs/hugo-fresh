{{ partial "navbar.html" . }}
{{ partial "navbar-clone.html" . }}

{{ if .Params.button_link }}
<a href="{{ .Params.button_link }}" target="_blank" class="sticky-consult-btn">
    <span class="sticky-consult-btn__icon">✉</span>
    <span class="sticky-consult-btn__text">{{ .Params.button_text | default "자세히 알아보기" }}</span>
</a>
{{ end }}

<div class="course-container">
    <div class="course-content">
        {{ if .Params.course_image }}
            <a href="{{ .Params.button_link }}" target="_blank" class="image-link">
                <img src="{{ printf "/images/courses/%s" .Params.course_image }}" alt="{{ .Title }} 과정 소개" class="course-image">
            </a>
        {{ end }}

        {{ if .Params.button_link }}
            <div class="button-container">
                <a href="{{ .Params.button_link }}" target="_blank" class="course-button">
                    {{ .Params.button_text | default "자세히 알아보기" }}
                </a>
            </div>
        {{ end }}
    </div>
</div>

<style>
.course-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 80px); /* 네비게이션 바 높이를 뺀 전체 높이 */
}

.course-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.image-link {
    display: block;
    width: 100%;
    text-align: center;
}

.course-image {
    max-width: 100%;
    height: auto;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
}

.course-image:hover {
    transform: translateY(-5px);
}

.button-container {
    margin-top: 2rem;
    text-align: center;
}

.course-button {
    display: inline-block;
    background-color: #4A7AFF;
    color: white;
    font-weight: bold;
    padding: 1rem 2rem;
    border-radius: 50px;
    text-decoration: none;
    font-size: 1.2rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.course-button:hover {
    background-color: #3563E9;
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}

/* ── 우측 스티키 버튼 ───────────────────────────────── */
.sticky-consult-btn {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #1e3a5f;
    color: #ffffff;
    text-decoration: none;
    padding: 16px 12px;
    border-radius: 10px 0 0 10px;
    box-shadow: -3px 0 16px rgba(0, 0, 0, 0.18);
    transition: background 0.22s ease, box-shadow 0.22s ease, padding 0.22s ease;
    writing-mode: vertical-rl;
    font-family: 'Pretendard Variable', sans-serif;
}

.sticky-consult-btn:hover {
    background: #16304f;
    box-shadow: -4px 0 20px rgba(0, 0, 0, 0.25);
    padding: 16px 14px;
    color: #ffffff;
}

.sticky-consult-btn__icon {
    writing-mode: horizontal-tb;
    font-size: 1.15rem;
    margin-bottom: 4px;
}

.sticky-consult-btn__text {
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.3;
}

@media screen and (max-width: 768px) {
    .course-container {
        padding: 1rem;
    }

    .course-button {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
    }

    .sticky-consult-btn {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        transform: none;
        flex-direction: row;
        border-radius: 12px 12px 0 0;
        writing-mode: horizontal-tb;
        justify-content: center;
        padding: 14px 20px;
        gap: 8px;
    }

    .sticky-consult-btn__icon {
        margin-bottom: 0;
    }

    .sticky-consult-btn__text {
        font-size: 0.95rem;
        letter-spacing: 0.04em;
    }
}
</style>
