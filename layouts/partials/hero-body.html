{{- $hero     := .Site.Params.hero }}
{{- $title    := index $hero "title" }}
{{- $image    := index $hero "image" }}

<div class="nb-hero" role="banner">
  <div class="nb-hero__bg"></div>
  <div class="nb-hero__grid" aria-hidden="true"></div>
  <div class="nb-hero__orb"  aria-hidden="true"></div>
  <div class="nb-hero__orb2" aria-hidden="true"></div>

  <div class="nb-hero__content">
    <div class="nb-hero__badge">Cybersecurity &amp; Education Experts</div>
    <h1 class="nb-hero__title">{{ $title }}</h1>
    <p class="nb-hero__subtitle">
      <span id="nb-typing"></span><span class="nb-cursor" aria-hidden="true"></span>
    </p>
    <div class="nb-hero__actions">
      <a href="/consulting/security/" class="nb-btn nb-btn--primary">서비스 알아보기</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeBy9CpVB10j64cskJE1tEsSXK9lJ4zl-f73oH1zaFvTfcrUA/viewform"
         class="nb-btn nb-btn--outline" target="_blank" rel="noopener noreferrer">컨설팅 문의</a>
    </div>
  </div>

  <div class="nb-scroll-down" aria-hidden="true"><span></span></div>
</div>
