{{ define "main" }}

{{ if eq .Layout "test" }}
    {{ partial "single/test.html" . }}
{{ else }}
    {{ partial "single/single.html" . }}
{{ end }}

{{ if .Params.include_footer }}
    {{ partial "footer.html" . }}
{{ end }}

{{ if .Params.sidebar }}
    {{ partial "single/sidebar.html" . }}
{{ end }}

{{ end }}
